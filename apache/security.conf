# LegalStudyBot hardening — enabled via a2enconf in the Dockerfile.

ServerTokens Prod
ServerSignature Off

# Private directories: logs, parsed course data, raw uploads, extra materials.
# These live inside the web root but must never be served directly.
<DirectoryMatch "^/var/www/html/(logs|data|uploads|extra)(/|$)">
    Require all denied
</DirectoryMatch>

# Secrets and generated index files.
<FilesMatch "^(config\.php|config\.example\.php|index_bm25\.json)$">
    Require all denied
</FilesMatch>

# Log/data file types anywhere under the web root.
<FilesMatch "\.(ndjson|csv|log|bak|sql)$">
    Require all denied
</FilesMatch>

<Directory /var/www/html>
    Options -Indexes
</Directory>

# Caching: HTML must always be revalidated so users pick up new asset
# version strings immediately; CSS/JS/images are safe to cache because
# their URLs carry ?v= cache-busters.
<FilesMatch "\.html$">
    Header always set Cache-Control "no-cache"
</FilesMatch>
<FilesMatch "\.(css|js|png|jpg|svg|ico)$">
    Header always set Cache-Control "public, max-age=604800"
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://holy-shape-0165.r7tffy4ps5.workers.dev; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
